name: "Auto-Release: Patch bump"

on:
  push:
    branches: [main]

jobs:
  release:
    if: |
      contains(github.event.head_commit.message, 'Bump ') ||
      contains(github.event.head_commit.author.name, 'dependabot')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag and bump patch
        id: tag
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          MAJOR=$(echo $LATEST | awk -F. '{print $1}')
          MINOR=$(echo $LATEST | awk -F. '{print $2}')
          PATCH=$(echo $LATEST | awk -F. '{print $3+1}')
          NEW_TAG="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Bumping $LATEST -> $NEW_TAG"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}
